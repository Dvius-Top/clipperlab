<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — ClipperLab</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --grafito:#15171c; --panel:#1d2028; --panel2:#23262f; --hueso:#edeae4; --voltaje:#ff7a2f; --gris:#9aa0a8; --verde:#4ade80; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--grafito); color:var(--hueso); font-family:'Inter',system-ui,sans-serif; padding:24px 16px 100px; line-height:1.5; }
    .caja { max-width:560px; margin:0 auto; }
    h1 { font-size:24px; margin-bottom:4px; }
    h1 span { color:var(--voltaje); }
    .sub { color:var(--gris); margin-bottom:20px; font-size:14px; }

    /* Tarjeta de cada PASO */
    .paso {
      background:var(--panel); border:1px solid rgba(255,255,255,0.08);
      border-radius:14px; padding:20px; margin-bottom:14px;
      opacity:0.45; pointer-events:none; transition:opacity 0.3s;
    }
    .paso.activo { opacity:1; pointer-events:auto; border-color:rgba(255,122,47,0.3); }
    .paso-titulo { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; margin-bottom:14px; }
    .paso-num { width:24px; height:24px; border-radius:50%; background:var(--voltaje); color:var(--grafito); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
    .paso-check { color:var(--verde); font-size:13px; margin-left:auto; text-align:right; }

    /* Servicios (selección múltiple) */
    .lista-serv { display:flex; flex-direction:column; gap:8px; }
    .card-serv {
      display:flex; align-items:flex-start; gap:12px; padding:12px 14px;
      background:var(--panel2); border:1px solid rgba(255,255,255,0.1); border-radius:10px; cursor:pointer;
    }
    .card-serv:hover { border-color:var(--voltaje); }
    .card-serv.sel { border-color:var(--voltaje); background:rgba(255,122,47,0.12); }
    .caja-check { width:20px; height:20px; border-radius:5px; border:2px solid var(--gris); flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--grafito); }
    .card-serv.sel .caja-check { background:var(--voltaje); border-color:var(--voltaje); }
    .serv-info { flex:1; min-width:0; }
    .serv-nom { font-size:15px; font-weight:600; }
    .serv-desc { font-size:13px; color:var(--gris); }
    .serv-dur { font-size:12px; color:var(--gris); margin-top:2px; }
    .serv-precio { font-weight:600; white-space:nowrap; }
    .total-serv { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.08); }
    .total-serv strong { font-size:18px; color:var(--voltaje); }
    .total-serv small { color:var(--gris); display:block; font-size:12px; }
    .boton-sec { background:var(--voltaje); color:var(--grafito); font-weight:600; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
    .boton-sec:disabled { opacity:0.35; cursor:not-allowed; }

    /* Trabajadores */
    .grid-trab { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .card-trab {
      display:flex; align-items:center; gap:12px; padding:12px 14px;
      background:var(--panel2); border:1px solid rgba(255,255,255,0.1); border-radius:10px; cursor:pointer;
    }
    .card-trab:hover { border-color:var(--voltaje); }
    .card-trab.sel { border-color:var(--voltaje); background:rgba(255,122,47,0.12); }
    .card-trab.cualquiera { grid-column:1 / -1; }
    .card-trab small { display:block; color:var(--gris); font-size:12px; }
    .avatar { width:38px; height:38px; border-radius:50%; background:var(--voltaje); color:var(--grafito); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0; }
    .avatar.alt { background:var(--verde); }
    .card-trab span { font-size:14px; }

    /* Días */
    .dias-cab { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .dias-cab button { background:none; border:1px solid rgba(255,255,255,0.15); color:var(--hueso); border-radius:8px; width:32px; height:32px; cursor:pointer; }
    .dias-mes { font-weight:600; text-transform:capitalize; font-size:14px; }
    .dias-fila { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
    .dias-fila::-webkit-scrollbar { height:5px; }
    .dias-fila::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }
    .dia-card { flex-shrink:0; width:62px; text-align:center; padding:12px 0; background:var(--panel2); border:1px solid rgba(255,255,255,0.1); border-radius:10px; cursor:pointer; }
    .dia-card:hover { border-color:var(--voltaje); }
    .dia-card.sel { border-color:var(--voltaje); background:var(--voltaje); color:var(--grafito); }
    .dia-card.sel .dia-nom { color:var(--grafito); }
    .dia-card.pasado { opacity:0.3; pointer-events:none; }
    .dia-nom { font-size:12px; color:var(--gris); text-transform:capitalize; }
    .dia-num { font-size:18px; font-weight:600; margin-top:2px; }

    /* Horas */
    .franja { color:var(--voltaje); font-size:12px; font-weight:600; margin:14px 0 8px; text-transform:uppercase; letter-spacing:0.5px; }
    .franja:first-child { margin-top:0; }
    .fila-horas { display:flex; flex-wrap:wrap; gap:8px; }
    .hora { padding:10px 18px; border-radius:8px; cursor:pointer; font-size:14px; border:1px solid rgba(255,255,255,0.15); background:var(--panel2); color:var(--hueso); }
    .hora:hover { border-color:var(--verde); }
    .hora.sel { background:var(--verde); color:var(--grafito); border-color:var(--verde); font-weight:600; }

    /* Datos */
    input, textarea { width:100%; background:var(--panel2); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:12px 14px; color:var(--hueso); font-size:15px; margin-bottom:12px; font-family:inherit; }
    input:focus, textarea:focus { outline:none; border-color:var(--voltaje); }
    textarea { min-height:80px; resize:vertical; }
    .boton { background:var(--voltaje); color:var(--grafito); font-weight:600; border:none; padding:14px; border-radius:10px; cursor:pointer; font-size:15px; width:100%; }
    .boton:hover { opacity:0.9; }
    .estado { font-size:14px; margin-top:12px; min-height:20px; }
    .resumen { background:var(--panel2); border-radius:10px; padding:12px 14px; font-size:14px; }
    .resumen div { display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
    .resumen div span:first-child { color:var(--gris); }
    .resumen .fila-total { border-top:1px solid rgba(255,255,255,0.08); margin-top:6px; padding-top:8px; font-weight:600; }
    .resumen-mini { color:var(--gris); font-size:13px; }
    .conteo { margin-top:20px; text-align:center; color:var(--gris); font-size:13px; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Agenda <span>ClipperLab</span></h1>
    <p class="sub">Reserva tu hora en simples pasos.</p>

    <!-- PASO 1: SERVICIOS -->
    <div class="paso activo" id="paso1">
      <div class="paso-titulo"><span class="paso-num">1</span> ¿Qué servicios quieres? <span class="paso-check" id="check1"></span></div>
      <div class="lista-serv" id="listaServ"></div>
      <div class="total-serv">
        <div><small>Total</small><strong id="totalServ">$0</strong> <small id="durServ"></small></div>
        <button class="boton-sec" id="btnServ" onclick="confirmarServicios()" disabled>Continuar</button>
      </div>
    </div>

    <!-- PASO 2: PROFESIONAL -->
    <div class="paso" id="paso2">
      <div class="paso-titulo"><span class="paso-num">2</span> ¿Con quién quieres atenderte? <span class="paso-check" id="check2"></span></div>
      <div class="grid-trab" id="gridTrab"></div>
    </div>

    <!-- PASO 3: DÍA -->
    <div class="paso" id="paso3">
      <div class="paso-titulo"><span class="paso-num">3</span> ¿Qué día? <span class="paso-check" id="check3"></span></div>
      <div class="dias-cab">
        <button onclick="cambiarMes(-1)">‹</button>
        <span class="dias-mes" id="diasMes"></span>
        <button onclick="cambiarMes(1)">›</button>
      </div>
      <div class="dias-fila" id="diasFila"></div>
    </div>

    <!-- PASO 4: HORA -->
    <div class="paso" id="paso4">
      <div class="paso-titulo"><span class="paso-num">4</span> ¿A qué hora? <span class="paso-check" id="check4"></span></div>
      <div id="listaHoras"></div>
    </div>

    <!-- PASO 5: DATOS -->
    <div class="paso" id="paso5">
      <div class="paso-titulo"><span class="paso-num">5</span> Tus datos</div>
      <div class="resumen" id="resumen"></div>
      <div style="margin-top:14px;">
        <input type="text" id="nombreCliente" placeholder="Tu nombre">
        <input type="email" id="correoCliente" placeholder="Tu correo (Gmail)">
        <input type="tel" id="telefonoCliente" placeholder="Tu WhatsApp (ej. +56 9 1234 5678)">
        <textarea id="descripcionCliente" placeholder="Mensaje para el profesional (opcional). Ej: quiero degradado bajo, traigo foto de referencia."></textarea>
        <button class="boton" onclick="reservar()">Confirmar reserva</button>
        <p class="estado" id="estado"></p>
      </div>
    </div>

    <div class="conteo" id="conteo"></div>
    <p class="conteo"><a href="panel.html" style="color:var(--gris);">Acceso equipo</a></p>
  </div>

  <script>
    const SUPABASE_URL = "https://ugchyfulwkzmxwqjwkwp.supabase.co";
    const SUPABASE_KEY = "sb_publishable__WRIUNVBq6-nxTAwPD360g_5UICkBn_";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ====== CONFIGURACIÓN (edita aquí) ======
    const SERVICIOS = [
      { id:"corte",     nombre:"Corte",      precio:11000, min:40, desc:"Corte a tijera o máquina, con lavado y peinado." },
      { id:"barba",     nombre:"Barba",      precio:6000,  min:20, desc:"Perfilado y arreglo de barba." },
      { id:"barbafull", nombre:"Barba Full", precio:10000, min:30, desc:"Barba con toalla caliente, navaja y productos." },
    ];
    const TRABAJADORES = ["Marcos", "Juan"];
    const HORAS = ["09:00","10:00","11:00","12:00","15:00","16:00","17:00"];
    const CUALQUIERA = "__cualquiera__";
    // ========================================

    let serviciosElegidos = [];      // ids
    let modoTrabajador = "";         // nombre o CUALQUIERA
    let trabajadorAsignado = "";     // el que finalmente atiende
    let fechaElegida = "", horaElegida = "";
    let fechaVista = new Date();
    let ocupacion = {};              // { "10:00": ["Marcos"], ... } del día elegido

    const $ = id => document.getElementById(id);
    const clp = n => "$" + n.toLocaleString("es-CL");
    function activar(id){ $(id).classList.add('activo'); }
    function desactivar(id){ $(id).classList.remove('activo'); }
    function servSel(){ return SERVICIOS.filter(s => serviciosElegidos.includes(s.id)); }
    function totalPrecio(){ return servSel().reduce((a,s)=>a+s.precio,0); }
    function totalMin(){ return servSel().reduce((a,s)=>a+s.min,0); }
    function nombresServ(){ return servSel().map(s=>s.nombre).join(" + "); }

    // ---------- PASO 1: SERVICIOS ----------
    function dibujarServicios(){
      $('listaServ').innerHTML = SERVICIOS.map(s => {
        const sel = serviciosElegidos.includes(s.id);
        return `<div class="card-serv ${sel?'sel':''}" onclick="toggleServicio('${s.id}')">
          <div class="caja-check">${sel?'✓':''}</div>
          <div class="serv-info"><div class="serv-nom">${s.nombre}</div><div class="serv-desc">${s.desc}</div><div class="serv-dur">${s.min} min</div></div>
          <div class="serv-precio">${clp(s.precio)}</div></div>`;
      }).join('');
      $('totalServ').textContent = clp(totalPrecio());
      $('durServ').textContent = serviciosElegidos.length ? `· ${totalMin()} min` : '';
      $('btnServ').disabled = serviciosElegidos.length === 0;
    }
    function toggleServicio(id){
      serviciosElegidos = serviciosElegidos.includes(id)
        ? serviciosElegidos.filter(x=>x!==id)
        : [...serviciosElegidos, id];
      dibujarServicios();
      // si ya había avanzado y cambia servicios, se actualiza el resumen
      if ($('check1').textContent) {
        if (serviciosElegidos.length === 0) { $('check1').textContent=''; ['paso2','paso3','paso4','paso5'].forEach(desactivar); }
        else { $('check1').textContent = '✓ ' + clp(totalPrecio()); dibujarResumen(); }
      }
    }
    function confirmarServicios(){
      if (!serviciosElegidos.length) return;
      $('check1').textContent = '✓ ' + clp(totalPrecio());
      activar('paso2');
      $('paso2').scrollIntoView({behavior:'smooth', block:'start'});
    }

    // ---------- PASO 2: PROFESIONAL ----------
    function dibujarTrabajadores(){
      let html = `<div class="card-trab cualquiera" data-t="${CUALQUIERA}" onclick="elegirTrabajador('${CUALQUIERA}', this)">
        <div class="avatar alt">⚡</div><span>Primer profesional disponible<small>Te mostramos todas las horas libres</small></span></div>`;
      html += TRABAJADORES.map(t =>
        `<div class="card-trab" data-t="${t}" onclick="elegirTrabajador('${t}', this)"><div class="avatar">${t[0]}</div><span>${t}</span></div>`
      ).join('');
      $('gridTrab').innerHTML = html;
    }
    function elegirTrabajador(t, el){
      modoTrabajador = t;
      document.querySelectorAll('.card-trab').forEach(c => c.classList.remove('sel'));
      el.classList.add('sel');
      $('check2').textContent = '✓ ' + (t === CUALQUIERA ? 'Primer disponible' : t);
      activar('paso3');
      if (fechaElegida) cargarHoras();
    }

    // ---------- PASO 3: DÍA ----------
    const NOMBRES_DIA = ["dom","lun","mar","mié","jue","vie","sáb"];
    function fechaTexto(f){ return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`; }
    function dibujarDias(){
      const año = fechaVista.getFullYear(), mes = fechaVista.getMonth();
      $('diasMes').textContent = fechaVista.toLocaleDateString('es-CL',{month:'long',year:'numeric'});
      const diasEnMes = new Date(año, mes+1, 0).getDate();
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      let html = '';
      for (let d=1; d<=diasEnMes; d++){
        const fecha = new Date(año,mes,d);
        const ft = fechaTexto(fecha);
        const pasado = fecha < hoy;
        html += `<div class="dia-card ${pasado?'pasado':''} ${ft===fechaElegida?'sel':''}" ${pasado?'':`onclick="elegirDia('${ft}', this)"`}>
          <div class="dia-nom">${NOMBRES_DIA[fecha.getDay()]}</div><div class="dia-num">${d}</div></div>`;
      }
      $('diasFila').innerHTML = html;
    }
    function cambiarMes(delta){ fechaVista.setDate(1); fechaVista.setMonth(fechaVista.getMonth()+delta); dibujarDias(); }
    function elegirDia(ft, el){
      fechaElegida = ft;
      document.querySelectorAll('.dia-card').forEach(c=>c.classList.remove('sel'));
      el.classList.add('sel');
      $('check3').textContent = '✓ ' + ft;
      activar('paso4');
      cargarHoras();
    }

    // ---------- PASO 4: HORA ----------
    function libresEn(hora){ return TRABAJADORES.filter(t => !(ocupacion[hora]||[]).includes(t)); }
    function horaPasada(h){
      if (fechaElegida !== fechaTexto(new Date())) return false;
      const [hh,mm] = h.split(':').map(Number), ahora = new Date();
      return hh*60+mm <= ahora.getHours()*60+ahora.getMinutes();
    }
    async function cargarHoras(){
      const cont = $('listaHoras');
      horaElegida = ""; trabajadorAsignado = ""; $('check4').textContent = '';
      desactivar('paso5');
      if (!modoTrabajador || !fechaElegida) return;
      cont.innerHTML = '<p class="resumen-mini">Cargando horas…</p>';

      // Consulta pública segura: solo hora + trabajador, sin datos de clientes
      const { data, error } = await db.rpc('horas_ocupadas', { p_fecha: fechaElegida });
      if (error) { cont.innerHTML = "Error: " + error.message; return; }
      ocupacion = {};
      data.forEach(r => { (ocupacion[r.hora] = ocupacion[r.hora] || []).push(r.trabajador); });

      const libres = HORAS.filter(h => {
        if (horaPasada(h)) return false;
        return modoTrabajador === CUALQUIERA ? libresEn(h).length > 0 : libresEn(h).includes(modoTrabajador);
      });

      if (!libres.length) { cont.innerHTML = '<p class="resumen-mini">No quedan horas este día. Elige otro.</p>'; return; }
      const boton = h => `<div class="hora" onclick="elegirHora('${h}', this)">${h}</div>`;
      const manana = libres.filter(h=>parseInt(h)<13), tarde = libres.filter(h=>parseInt(h)>=13);
      let html = '';
      if (manana.length) html += '<div class="franja">Mañana</div><div class="fila-horas">'+manana.map(boton).join('')+'</div>';
      if (tarde.length)  html += '<div class="franja">Tarde</div><div class="fila-horas">'+tarde.map(boton).join('')+'</div>';
      cont.innerHTML = html;
    }
    function elegirHora(h, el){
      horaElegida = h;
      trabajadorAsignado = modoTrabajador === CUALQUIERA ? libresEn(h)[0] : modoTrabajador;
      document.querySelectorAll('.hora').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
      $('check4').textContent = '✓ ' + h;
      dibujarResumen();
      activar('paso5');
      $('paso5').scrollIntoView({behavior:'smooth', block:'start'});
    }

    // ---------- PASO 5: DATOS ----------
    function dibujarResumen(){
      if (!horaElegida) return;
      const filas = servSel().map(s => `<div><span>${s.nombre} (${s.min} min)</span><span>${clp(s.precio)}</span></div>`).join('');
      $('resumen').innerHTML = filas +
        `<div><span>Profesional</span><span>${trabajadorAsignado}</span></div>` +
        `<div><span>Fecha y hora</span><span>${fechaElegida} · ${horaElegida}</span></div>` +
        `<div class="fila-total"><span>Total (${totalMin()} min)</span><span>${clp(totalPrecio())}</span></div>`;
    }

    async function reservar(){
      const nombre = $('nombreCliente').value.trim();
      const correo = $('correoCliente').value.trim();
      const telefono = $('telefonoCliente').value.trim();
      const mensaje = $('descripcionCliente').value.trim();
      const estado = $('estado');
      if (!serviciosElegidos.length){ estado.textContent="Elige al menos un servicio."; return; }
      if (!nombre){ estado.textContent="Escribe tu nombre."; return; }
      if (!correo){ estado.textContent="Escribe tu correo."; return; }
      if (!telefono){ estado.textContent="Escribe tu WhatsApp."; return; }
      estado.textContent = "Reservando...";

      // Revisar de nuevo quién está libre a esa hora (por si alguien reservó recién)
      const { data:check } = await db.rpc('horas_ocupadas', { p_fecha: fechaElegida });
      const ocupados = (check||[]).filter(r=>r.hora===horaElegida).map(r=>r.trabajador);
      if (ocupados.includes(trabajadorAsignado)) {
        const otro = modoTrabajador === CUALQUIERA ? TRABAJADORES.find(t=>!ocupados.includes(t)) : null;
        if (otro) { trabajadorAsignado = otro; }
        else { estado.textContent="Uy, esa hora se acaba de ocupar. Elige otra."; cargarHoras(); return; }
      }

      const servicios = nombresServ(), total = clp(totalPrecio()), duracion = totalMin() + " min";
      // Se guarda todo en "descripcion" para no tener que cambiar la tabla
      const descripcion = `Servicios: ${servicios} | Total: ${total} | ${duracion}` + (mensaje ? `\nMensaje: ${mensaje}` : '');

      const { error } = await db.from('reservas').insert({
        nombre, hora:horaElegida, fecha:fechaElegida, trabajador:trabajadorAsignado, correo, telefono, descripcion
      });
      if (error){
        // 23505 = el candado anti-tope de la base de datos detectó que la hora ya se tomó
        estado.textContent = error.code === '23505' ? "Uy, esa hora se acaba de ocupar. Elige otra." : "Error: " + error.message;
        if (error.code === '23505') cargarHoras();
        return;
      }

      try {
        await fetch("https://formspree.io/f/xzezawgo", { method:"POST",
          headers:{ "Content-Type":"application/json", "Accept":"application/json" },
          body: JSON.stringify({ _subject:"Nueva reserva ClipperLab", servicios, total, duracion,
            trabajador:trabajadorAsignado, fecha:fechaElegida, hora:horaElegida, nombre, correo, telefono, mensaje }) });
      } catch(e) {}

      estado.textContent = `✓ Reservado: ${servicios} con ${trabajadorAsignado}, ${fechaElegida} a las ${horaElegida}. Total ${total}.`;
      ['nombreCliente','correoCliente','telefonoCliente','descripcionCliente'].forEach(id => $(id).value='');
      cargarHoras(); cargarConteo();
    }

    async function cargarConteo(){
      const { data:count, error } = await db.rpc('total_reservas');
      if (!error) $('conteo').innerHTML = `Total de reservas: <strong style="color:var(--hueso)">${count}</strong>`;
    }

    dibujarServicios(); dibujarTrabajadores(); dibujarDias(); cargarConteo();
  </script>
</body>
</html>
